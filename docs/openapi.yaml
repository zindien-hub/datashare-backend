openapi: 3.0.3

info:
  title: DataShare API
  version: 1.0.0
  description: >
    API REST du backend DataShare.

    Cette API permet :
    - l'inscription et la connexion d'un utilisateur ;
    - l'upload d'un fichier pour un utilisateur authentifié ;
    - la consultation de l'historique des fichiers ;
    - la suppression d'un fichier par son propriétaire ;
    - le téléchargement public d'un fichier via un token.

servers:
  - url: http://localhost:8080
    description: Environnement local

tags:
  - name: Authentication
    description: Endpoints d'authentification
  - name: Files
    description: Endpoints protégés de gestion des fichiers
  - name: Public Download
    description: Endpoint public de téléchargement

paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Crée un nouvel utilisateur.
      operationId: registerUser
      requestBody:
        required: true
        description: Données d'inscription
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  email: test@datashare.com
                  password: password1234
      responses:
        '201':
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    message: User registered successfully
        '400':
          description: Requête invalide ou utilisateur déjà existant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    message: Invalid registration request
        '500':
          description: Erreur interne serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate a user
      description: Authentifie un utilisateur et retourne un JWT.
      operationId: loginUser
      requestBody:
        required: true
        description: Données de connexion
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: test@datashare.com
                  password: password1234
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    token: eyJhbGciOiJIUzI1NiJ9.example.token
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    message: Invalid credentials
        '500':
          description: Erreur interne serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files:
    post:
      tags:
        - Files
      summary: Upload a file
      description: Téléverse un fichier pour l'utilisateur authentifié.
      operationId: uploadFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Fichier à téléverser
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Fichier téléversé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
              examples:
                success:
                  value:
                    id: 1
                    originalName: document.pdf
                    downloadToken: 2f4a7d52-7d3a-4f38-bb5c-6123f7a95c01
                    downloadUrl: /download/2f4a7d52-7d3a-4f38-bb5c-6123f7a95c01
                    expiresAt: 2026-05-20T15:00:00
        '400':
          description: Requête invalide ou fichier non accepté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Fichier trop volumineux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Type de fichier non supporté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Files
      summary: Get current user's file history
      description: Retourne l'historique des fichiers de l'utilisateur authentifié.
      operationId: getCurrentUserFiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historique récupéré avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileListItemResponse'
              examples:
                success:
                  value:
                    - id: 2
                      originalName: spring_initializr.png
                      contentType: image/png
                      size: 158261
                      downloadToken: 1c99cd19-31a4-43ad-bfae-7a528a630a89
                      downloadUrl: /download/1c99cd19-31a4-43ad-bfae-7a528a630a89
                      expiresAt: 2026-05-12T12:34:31.894332
                      createdAt: 2026-05-05T12:34:31.907081
        '401':
          description: JWT manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/{id}:
    delete:
      tags:
        - Files
      summary: Delete a file
      description: Supprime un fichier appartenant à l'utilisateur authentifié.
      operationId: deleteFile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant du fichier
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Fichier supprimé avec succès
        '400':
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Suppression interdite pour cet utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fichier introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /download/{token}:
    get:
      tags:
        - Public Download
      summary: Download a file by token
      description: Télécharge publiquement un fichier via son token.
      operationId: downloadFileByToken
      parameters:
        - name: token
          in: path
          required: true
          description: Token public de téléchargement
          schema:
            type: string
      responses:
        '200':
          description: Téléchargement du fichier
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Token invalide ou lien expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fichier introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: test@datashare.com
        password:
          type: string
          minLength: 8
          example: password1234

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: test@datashare.com
        password:
          type: string
          example: password1234

    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.example.token

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: User registered successfully

    FileUploadResponse:
      type: object
      required:
        - id
        - originalName
        - downloadToken
        - downloadUrl
        - expiresAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        originalName:
          type: string
          example: document.pdf
        downloadToken:
          type: string
          example: 2f4a7d52-7d3a-4f38-bb5c-6123f7a95c01
        downloadUrl:
          type: string
          example: /download/2f4a7d52-7d3a-4f38-bb5c-6123f7a95c01
        expiresAt:
          type: string
          format: date-time
          example: 2026-05-20T15:00:00

    FileListItemResponse:
      type: object
      required:
        - id
        - originalName
        - size
        - downloadToken
        - downloadUrl
        - expiresAt
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 2
        originalName:
          type: string
          example: spring_initializr.png
        contentType:
          type: string
          nullable: true
          example: image/png
        size:
          type: integer
          format: int64
          example: 158261
        downloadToken:
          type: string
          example: 1c99cd19-31a4-43ad-bfae-7a528a630a89
        downloadUrl:
          type: string
          example: /download/1c99cd19-31a4-43ad-bfae-7a528a630a89
        expiresAt:
          type: string
          format: date-time
          example: 2026-05-12T12:34:31.894332
        createdAt:
          type: string
          format: date-time
          example: 2026-05-05T12:34:31.907081

    ErrorResponse:
      type: object
      required:
        - message
        - status
        - timestamp
      properties:
        message:
          type: string
          example: Invalid credentials
        status:
          type: integer
          example: 401
        timestamp:
          type: string
          format: date-time
          example: 2026-05-05T12:34:31.908050
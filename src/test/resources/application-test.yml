spring:
  datasource:
    url: jdbc:h2:mem:datashare_test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-at-least-32-characters-long
  expiration-ms: 3600000

app:
  file-storage:
    upload-dir: target/test-uploads
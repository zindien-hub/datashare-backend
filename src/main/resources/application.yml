spring:
  application:
    name: datashare-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

app:
  file-storage:
    upload-dir: ${UPLOAD_DIR}
  upload:
    max-size-bytes: 5242880
    allowed-content-types:
      - image/png
      - image/jpeg
      - application/pdf
      - text/plain